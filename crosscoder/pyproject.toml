[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dictionary_learning"
version = "0.1.0"
description = "Heterogeneous BatchTopK crosscoders for a student, its OPD checkpoint, and the teacher"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch>=2.1",
    "einops",
    "numpy",
    "datasets",
    "huggingface_hub",
    "transformers",
    "tqdm",
    "wandb",
    "zstandard",
]

[tool.setuptools.packages.find]
include = ["dictionary_learning*"]
